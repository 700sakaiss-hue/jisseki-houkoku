<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点検日報">
<meta name="theme-color" content="#0F5229">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>稼働報告アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --grn-50: #EAF5EE; --grn-100: #B8DFC2; --grn-200: #7EC496;
    --grn-400: #3A9E5F; --grn-600: #1E7A42; --grn-800: #0F5229; --grn-900: #073318;
    --gray-50: #F1EFE8; --gray-100: #D3D1C7; --gray-200: #B4B2A9;
    --gray-400: #888780; --gray-600: #5F5E5A; --gray-800: #444441;
    --glass:       rgba(255,255,255,0.70);
    --glass-input: rgba(255,255,255,0.85);
    --glass-border: rgba(255,255,255,0.70);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-size: 16px; color: #1a1a1a; min-height: 100vh;
    background-image: url('bg-green.jpg');
    background-size: cover; background-position: center; background-attachment: fixed;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: rgba(255,255,255,0.5);
    z-index: 0; pointer-events: none;
  }
  header {
    background: #247658;
    border-bottom: none;
    color: white; padding: 10px 16px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  }
  .header-inner {
    max-width: 580px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; width: 100%;
  }
  .header-logo { height: 40px; width: auto; display: block; }
  @media (min-width: 580px) { .header-logo { height: 80px; } }
  header h1 { font-size: 15px; font-weight: 500; color: white; }
  header span { font-size: 13px; opacity: 0.8; }
  .tab-bar {
    background: #247658;
    border-bottom: 2px solid #1a5e45;
    position: fixed; top: 0; left: 0; right: 0; z-index: 99;
  }
  .tab-bar-inner {
    max-width: 580px; margin: 0 auto;
    display: flex;
  }
  .tab-btn {
    flex: 1; padding: 12px 8px; border: none; background: none;
    font-size: 15px; color: rgba(255,255,255,0.6); cursor: pointer;
    border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  .tab-btn.active { color: #fff; border-bottom-color: #fff; font-weight: 500; }
  .page { display: none; padding: 12px; max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
  .page.active { display: block; }
  .card {
    background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 14px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 16px rgba(0,100,70,0.08);
  }
  .card-title {
    font-size: 14px; font-weight: 500; color: var(--grn-800);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--grn-50);
  }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 14px; color: var(--gray-600); margin-bottom: 6px; font-weight: 500; }
  label .required, .required { color: #e24b4a; margin-left: 4px; font-size: 12px; }
  input[type="text"], input[type="date"], textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid rgba(58,158,95,0.4); border-radius: 8px;
    font-size: 16px; background: var(--glass-input);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none; transition: border 0.2s;
  }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
    outline: none; border-color: rgba(13,158,106,0.5); box-shadow: 0 0 0 3px rgba(13,158,106,0.15);
  }
  textarea { resize: vertical; min-height: 80px; }
  .area-block {
    border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px;
    margin-bottom: 12px; background: rgba(200,240,220,0.3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .area-block-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .area-block-label {
    font-size: 13px; font-weight: 500; color: var(--grn-600);
    background: var(--grn-50); padding: 3px 10px; border-radius: 20px;
  }
  .btn-remove-area {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid #f0b0b0;
    background: white; color: #e24b4a; font-size: 18px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .btn-remove-area:active { background: #fef0f0; }
  .count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .count-item label { font-size: 13px; }
  .count-input {
    width: 100%; padding: 6px 4px; border: 1.5px solid rgba(58,158,95,0.4); border-radius: 8px;
    font-size: 18px; font-weight: 500; text-align: center; color: #0a3d28;
    background: var(--glass-input);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    -webkit-appearance: none;
  }
  .count-input:focus { outline: none; border-color: rgba(13,158,106,0.5); box-shadow: 0 0 0 3px rgba(13,158,106,0.15); }
  /* 明日の点検区（複数） */
  .tomorrow-input-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .tomorrow-input-row input[type="text"] { flex: 1; }
  .btn-remove-tomorrow {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #f0b0b0;
    background: white; color: #e24b4a; font-size: 18px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-remove-tomorrow:active { background: #fef0f0; }
  .area-summary { margin-bottom: 12px; }
  .area-summary-title {
    font-size: 13px; font-weight: 500; color: #0a3d28;
    background: rgba(200,240,220,0.5); backdrop-filter:blur(8px);
    padding: 6px 12px;
    border-radius: 8px 8px 0 0; border: 1px solid var(--glass-border); border-bottom: none;
  }
  .summary-table {
    width: 100%; border-collapse: collapse;
    border: 1px solid var(--glass-border); border-radius: 0 0 8px 8px;
    font-size: 13px; background: var(--glass);
  }
  .summary-table th {
    background: rgba(255,255,255,0.65); color: var(--grn-800); font-weight: 500;
    padding: 7px 6px; text-align: center;
    border-bottom: 1px solid var(--grn-100); border-right: 1px solid var(--grn-100);
  }
  .summary-table th:last-child { border-right: none; }
  .summary-table td {
    padding: 7px 6px; text-align: center;
    border-bottom: 1px solid #e4f0e8; border-right: 1px solid #e4f0e8; color: var(--gray-800);
    background: rgba(228,246,243,0.70);
  }
  .summary-table td:last-child { border-right: none; }
  .summary-table td:first-child { text-align: left; font-weight: 500; color: var(--grn-800); padding-left: 10px; }
  .summary-table tr:last-child td { border-bottom: none; font-weight: 500; background: rgba(255,255,255,0.65); }
  .summary-table .zero { color: var(--gray-200); }
  .tomorrow-list {
    border: 1px solid var(--glass-border); border-radius: 0 0 8px 8px;
    background: var(--glass); backdrop-filter:blur(12px);
    padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tomorrow-tag {
    background: #eaf6ef; color: var(--grn-800); border: 1px solid var(--grn-100);
    font-size: 14px; font-weight: 500; padding: 5px 14px; border-radius: 20px;
  }
  .btn-add-area {
    width: 100%; padding: 12px; border: 1.5px dashed rgba(0,160,100,0.35);
    background: rgba(200,240,220,0.3);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #0a6644; border-radius: 12px;
    font-size: 15px; cursor: pointer; transition: all 0.15s;
  }
  .btn-add-area:active { background: rgba(200,240,220,0.5); }
  .btn-submit {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #0d9e6a, #0a6644);
    color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 500;
    cursor: pointer; margin-top: 4px;
    box-shadow: 0 4px 20px rgba(13,158,106,0.4);
    transition: all 0.2s;
  }
  .btn-submit:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(13,158,106,0.3); }
  .btn-submit:disabled { background: var(--gray-200); box-shadow: none; cursor: not-allowed; }
  .date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .date-nav input[type="date"] { flex: 1; padding: 10px 12px; font-size: 16px; }
  .date-nav button {
    padding: 10px 14px;
    background: linear-gradient(135deg, #0d9e6a, #0a6644);
    color: white; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(13,158,106,0.35);
  }
  .record-item {
    background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 2px 16px rgba(0,100,70,0.08);
    border-left: 4px solid rgba(13,158,106,0.7);
  }
  .record-header {
    display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px;
  }
  .record-name { font-size: 16px; font-weight: 500; color: var(--grn-800); }
  .record-actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 8px; }
  .btn-edit, .btn-del {
    padding: 6px 12px; border-radius: 6px; font-size: 13px;
    border: 1px solid; cursor: pointer; background: white;
  }
  .btn-edit { color: var(--grn-600); border-color: var(--grn-200); }
  .btn-del { color: #e24b4a; border-color: #f0b0b0; }
  .area-section { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .area-tag {
    display: inline-block; background: var(--grn-50); color: var(--grn-800);
    font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
    border: 1px solid var(--grn-200);
  }
  .counts-row { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .count-badge {
    background: #f0f7f2; border-radius: 5px; padding: 3px 7px; font-size: 12px;
    display: flex; align-items: center; gap: 3px;
  }
  .count-badge .cb-label { color: var(--gray-600); }
  .count-badge .cb-val { color: var(--grn-800); font-weight: 500; }
  .area-divider { border: none; border-top: 1px dashed #c8e0cf; margin: 8px 0; }
  .record-note {
    font-size: 13px; color: #5a4000; margin-top: 8px;
    background: #fff8e6; border-left: 3px solid #e6ac00;
    padding: 6px 10px; border-radius: 0 6px 6px 0;
  }
  .record-tomorrow { font-size: 13px; color: #292a2d; margin-top: 2px; }
  .empty-msg { text-align: center; color: var(--gray-400); padding: 40px 20px; font-size: 15px; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 200; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 16px 16px 0 0; padding: 20px 20px 32px;
    width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
  }
  .modal-title {
    font-size: 16px; font-weight: 500; margin-bottom: 16px; color: var(--grn-800);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-close { font-size: 22px; background: none; border: none; cursor: pointer; color: var(--gray-400); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: var(--gray-400); padding: 20px; font-size: 14px; }
  #login-screen { display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; padding:2rem; }
  #login-screen.active { display:flex; }
  .login-card { background: var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border: 1px solid var(--glass-border); border-radius:20px; padding:2rem; width:100%; max-width:360px; box-shadow:0 4px 24px rgba(0,100,70,0.1); }
  .login-logo { font-size:13px; color:var(--gray-400); text-align:center; margin-bottom:8px; }
  .login-title { font-size:22px; font-weight:500; color:var(--grn-800); text-align:center; margin-bottom:2rem; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:13px; color:var(--gray-600); margin-bottom:6px; font-weight:500; }
  .login-field input { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:8px; font-size:16px; -webkit-appearance:none; }
  .login-field input:focus { outline:none; border-color:var(--grn-400); box-shadow:0 0 0 3px rgba(58,158,95,0.15); }
  .btn-login { width:100%; padding:14px; background:linear-gradient(135deg,#0d9e6a,#0a6644); color:white; border:none; border-radius:10px; font-size:16px; font-weight:500; cursor:pointer; margin-top:8px; box-shadow:0 4px 16px rgba(13,158,106,0.35); transition:all 0.2s; }
  .btn-login:active { transform:scale(0.98); }
  .login-error { font-size:13px; color:#e24b4a; text-align:center; margin-top:10px; min-height:18px; }
  .company-badge { font-size:11px; background:rgba(255,255,255,0.2); color:rgba(255,255,255,0.9); border:1px solid rgba(255,255,255,0.3); border-radius:10px; padding:2px 8px; margin-left:8px; }
  .btn-logout { font-size:11px; color:#fff; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:3px 8px; cursor:pointer; }
  .admin-only { display: none; }
  .btn-export {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #0d9e6a, #0a6644);
    color: white; border: none; border-radius: 12px; font-size: 15px;
    font-weight: 500; cursor: pointer; margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(13,158,106,0.4); transition: all 0.15s;
  }
  .btn-export:active { transform: scale(0.98); }
  .btn-export:disabled { background: var(--gray-200); box-shadow: none; color: #fff; cursor: not-allowed; }
  .firebase-warning {
    background: rgba(255,248,230,0.7); backdrop-filter:blur(8px);
    border: 1px solid rgba(245,200,66,0.5); border-radius: 8px;
    padding: 12px 14px; font-size: 13px; color: #8a6000; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">堺総合サービス</div>
    <div class="login-title">稼働報告アプリ</div>
    <div class="login-field">
      <label>メールアドレス</label>
      <input type="email" id="login-email" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<header id="main-header" style="display:none;">
  <div class="header-inner">
    <!-- 左列：ロゴ -->
    <img src="logo.png" class="header-logo" alt="堺総合サービス">
    <!-- 右列 -->
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
      <div style="display:flex;gap:6px;">
        <button onclick="location.reload()" style="font-size:13px;color:#fff;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:3px 8px;cursor:pointer;">↻ 更新</button>
        <button class="btn-logout" onclick="doLogout()" style="font-size:11px;padding:3px 8px;">ログアウト</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
        <span id="header-date" style="font-size:11px;opacity:0.8;"></span>
        <span id="company-badge" class="company-badge" style="margin-left:0;"></span>
      </div>
    </div>
  </div>
</header>

<div class="tab-bar" id="main-tabbar" style="display:none;">
  <div class="tab-bar-inner" style="width:100%;">
    <button class="tab-btn active" onclick="switchTab('input')">入力</button>
    <button class="tab-btn" onclick="switchTab('list')">一覧・集計</button>
    <button class="tab-btn" onclick="switchTab('attend')">点検者登録</button>
  </div>
</div>

<div id="page-input" class="page active" style="display:none;">
  <div id="firebase-warning" class="firebase-warning" style="display:none">
    ⚠️ Firebase未設定のため、データは保存されません。firebaseConfigを設定してください。
  </div>

  <div class="card">
    <div class="form-group">
      <label>日付<span class="required">必須</span></label>
      <input type="date" id="inp-date">
    </div>
    <div class="form-group">
      <label>担当者<span class="required">必須</span></label>
      <input type="text" id="inp-name" placeholder="例：山田太郎">
    </div>
  </div>

  <div class="card">
    <div class="card-title">点検区・実施件数<span class="required">必須</span></div>
    <div id="area-blocks"></div>
    <button class="btn-add-area" onclick="addAreaBlock('area-blocks','inp')">＋ 点検区を追加</button>
  </div>

  <div class="card">
    <div class="card-title">次回点検予定／備考 <span class="required">必須</span></div>
    <div class="form-group">
      <label>明日の点検区（通常点検）</label>
      <div id="inp-tomorrow-list"></div>
      <button class="btn-add-area" onclick="addTomorrowRow('inp-tomorrow-list','inp')" style="margin-top:4px">＋ 点検区を追加</button>
    </div>
    <div class="form-group">
      <label>明日の点検区（キズミー）</label>
      <div id="inp-tomorrow-kizumi-list"></div>
      <button class="btn-add-area" onclick="addTomorrowRow('inp-tomorrow-kizumi-list','inp-kz')" style="margin-top:4px">＋ 点検区を追加</button>
    </div>
    <div class="form-group">
      <label>備考（任意）</label>
      <textarea id="inp-note" placeholder="特記事項など"></textarea>
    </div>
  </div>

  <button class="btn-submit" id="submit-btn" onclick="submitRecord()">送信する</button>
  <div style="height:24px"></div>
</div>

<div id="page-list" class="page" style="display:none;">
  <div class="date-nav">
    <input type="date" id="list-date" onchange="loadList()">
    <button onclick="goToday()">今日</button>
  </div>
  <div id="export-badge" style="display:none;margin-bottom:10px;">
    <div style="background:#FFF450;color:#5a3e00;border-radius:10px;padding:8px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <span style="font-size:12px;font-weight:500;line-height:1.6;">✅ 本日エクスポート済み。<br>※報告内容変更の場合は、必ず管理者へご連絡お願いいたします。</span>
      <button id="btn-cancel-export" onclick="cancelExport()" style="display:none;font-size:11px;background:rgba(90,62,0,0.15);color:#5a3e00;border:1px solid rgba(90,62,0,0.3);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;flex-shrink:0;">解除</button>
    </div>
  </div>
  <!-- 報告状況 -->
  <div class="card" id="attend-check-card" style="display:none;">
    <div class="card-title" style="margin-bottom:8px;">報告状況</div>
    <div id="attend-check-result"></div>
  </div>
  <div id="list-container"><div class="loading">読み込み中...</div></div>
  <button class="btn-export admin-only" id="export-btn" onclick="exportExcel()" disabled>Excel様式にエクスポート</button>
</div>

<div id="page-attend" class="page" style="display:none;">
  <div class="card">
    <div class="card-title">点検者登録</div>
    <div class="form-group">
      <label>日付<span class="required">必須</span></label>
      <input type="date" id="attend-date" onchange="initAttend()">
    </div>
    <!-- 管理者：会社タブ -->
    <div id="attend-company-tabs" style="display:none; margin-bottom:12px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;" id="attend-tab-btns"></div>
    </div>
    <div class="form-group">
      <label>本日の点検者</label>
      <div id="attend-list"></div>
      <button class="btn-add-area" onclick="addAttendRow()" style="margin-top:4px">＋ 点検者を追加</button>
      <button onclick="clearAllAttend()" style="margin-top:8px;width:100%;padding:10px;border:1.5px solid rgba(226,75,74,0.4);background:rgba(226,75,74,0.08);color:#e24b4a;border-radius:12px;font-size:14px;cursor:pointer;">全員削除</button>
    </div>
    <button class="btn-submit" onclick="saveAttend()">保存する</button>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">
      記録を編集
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label>担当者名<span class="required">必須</span></label>
      <input type="text" id="edit-name" placeholder="例：山田太郎">
    </div>
    <div id="edit-area-blocks"></div>
    <button class="btn-add-area" onclick="addAreaBlock('edit-area-blocks','edit')" style="margin-bottom:16px">＋ 点検区を追加</button>
    <div class="form-group">
      <label>明日の点検区（通常点検）</label>
      <div id="edit-tomorrow-list"></div>
      <button class="btn-add-area" onclick="addTomorrowRow('edit-tomorrow-list','edit')" style="margin-top:4px">＋ 点検区を追加</button>
    </div>
    <div class="form-group">
      <label>明日の点検区（キズミー）</label>
      <div id="edit-tomorrow-kizumi-list"></div>
      <button class="btn-add-area" onclick="addTomorrowRow('edit-tomorrow-kizumi-list','edit-kz')" style="margin-top:4px">＋ 点検区を追加</button>
    </div>
    <div class="form-group"><label>備考</label><textarea id="edit-note"></textarea></div>
    <button class="btn-submit" onclick="saveEdit()">保存する</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, remove, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4bnxODVw2lDyi2DT1uaxfHq4jcWh5uew",
  authDomain: "jisseki-houkoku.firebaseapp.com",
  databaseURL: "https://jisseki-houkoku-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jisseki-houkoku",
  storageBucket: "jisseki-houkoku.firebasestorage.app",
  messagingSenderId: "558192827490",
  appId: "1:558192827490:web:a75463f4101886cc45c53b"
};

let db = null, auth = null, editingKey = null, currentListener = null;
let currentUser = null;

const COMPANY_MAP = {
  "kitaguchi@sakaiss.com":  { companyId: "sakai",   companyName: "堺総合サービス", isAdmin: true },
  "shingaki@sakaiss.com":   { companyId: "trieze",  companyName: "トリエズ",       isAdmin: false },
};

try {
  const app = initializeApp(firebaseConfig);
  db   = getDatabase(app);
  auth = getAuth(app);
} catch(e) {
  document.getElementById("firebase-warning").style.display = "block";
}

onAuthStateChanged(auth, user => {
  if (user) {
    const info = COMPANY_MAP[user.email] || { companyId: user.uid, companyName: user.email, isAdmin: false };
    currentUser = { uid: user.uid, email: user.email, ...info };
    document.getElementById("login-screen").classList.remove("active");
    document.getElementById("main-header").style.display = "";
    document.getElementById("main-tabbar").style.display = "";
    const savedTab = sessionStorage.getItem("activeTab") || "input";
    switchTab(savedTab);
    document.getElementById("page-attend").style.display = savedTab === "attend" ? "" : "none";
    document.getElementById("attend-date").value = todayStr();
    document.getElementById("company-badge").textContent = currentUser.companyName;
    document.querySelectorAll(".admin-only").forEach(el => {
      el.style.display = currentUser.isAdmin ? "block" : "none";
    });
    const cancelBtn = document.getElementById("btn-cancel-export");
    if (cancelBtn) cancelBtn.style.display = currentUser.isAdmin ? "" : "none";
    adjustLayout();
  } else {
    currentUser = null;
    document.getElementById("login-screen").classList.add("active");
    document.getElementById("main-header").style.display = "none";
    document.getElementById("main-tabbar").style.display = "none";
    document.getElementById("page-input").style.display = "none";
    document.getElementById("page-list").style.display = "none";
    document.getElementById("page-attend").style.display = "none";
    if (currentListener) { currentListener(); currentListener = null; }
  }
});

window.doLogin = async function() {
  const email = document.getElementById("login-email").value.trim();
  const pass  = document.getElementById("login-pass").value;
  const btn   = document.querySelector(".btn-login");
  const err   = document.getElementById("login-error");
  if (!email || !pass) { err.textContent = "メールアドレスとパスワードを入力してください"; return; }
  btn.textContent = "ログイン中..."; btn.disabled = true; err.textContent = "";
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    const msg = {
      "auth/invalid-credential":    "メールアドレスまたはパスワードが違います",
      "auth/user-not-found":        "このメールアドレスは登録されていません",
      "auth/wrong-password":        "パスワードが違います",
      "auth/invalid-email":         "メールアドレスの形式が正しくありません",
      "auth/too-many-requests":     "試行回数が多すぎます。しばらく待ってから再試行してください",
      "auth/network-request-failed":"ネットワークエラーが発生しました",
    }[e.code] || "エラー: " + e.code;
    err.textContent = msg;
    btn.textContent = "ログイン"; btn.disabled = false;
  }
};
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("login-screen").classList.contains("active")) doLogin();
});
window.doLogout = async function() { await signOut(auth); };

function todayStr() { return new Date().toISOString().slice(0,10); }

function adjustLayout() {
  const header = document.querySelector('header');
  const tabBar = document.querySelector('.tab-bar');
  const pages  = document.querySelectorAll('.page');
  const hh = header.offsetHeight;
  const th = tabBar.offsetHeight;
  tabBar.style.top = hh + 'px';
  pages.forEach(p => p.style.paddingTop = (hh + th + 12) + 'px');
}
adjustLayout();
window.addEventListener('resize', adjustLayout);
document.getElementById("inp-date").value = todayStr();
document.getElementById("list-date").value = todayStr();
document.getElementById("header-date").textContent =
  new Date().toLocaleDateString("ja-JP", {month:"short",day:"numeric",weekday:"short"});

window.goToday = () => { document.getElementById("list-date").value = todayStr(); loadList(); };

window.switchTab = function(tab) {
  sessionStorage.setItem("activeTab", tab);
  document.querySelectorAll(".tab-btn").forEach((b,i) => {
    b.classList.toggle("active", ["input","list","attend"][i] === tab);
  });
  document.getElementById("page-input").style.display  = tab==="input"  ? "" : "none";
  document.getElementById("page-list").style.display   = tab==="list"   ? "" : "none";
  document.getElementById("page-attend").style.display = tab==="attend" ? "" : "none";
  document.getElementById("page-input").classList.toggle("active",  tab==="input");
  document.getElementById("page-list").classList.toggle("active",   tab==="list");
  document.getElementById("page-attend").classList.toggle("active", tab==="attend");
  if (tab==="list")   loadList();
  if (tab==="attend") initAttend();
};

// ---- 点検区ブロック ----
let blockSeq = 0;

function makeBlockHtml(uid, idx, areaVal, k, e, d1, d2, kizumi, removable) {
  const rmBtn = removable
    ? '<button class="btn-remove-area" onclick="removeBlock(\'' + uid + '\')">×</button>'
    : "";
  return '<div class="area-block" id="block-' + uid + '">'
    + '<div class="area-block-header">'
    + '<span class="area-block-label">点検区 ' + (idx+1) + '</span>'
    + rmBtn
    + '</div>'
    + '<div class="form-group" style="margin-bottom:12px">'
    + '<input type="text" id="aname-' + uid + '" placeholder="例：都島区" value="' + esc(areaVal) + '">'
    + '</div>'
    + '<div class="count-grid">'
    + ci("近接点検", "ck-" + uid, k)
    + ci("遠方点検", "ce-" + uid, e)
    + ci("詳細点検1", "cd1-" + uid, d1)
    + ci("詳細点検2", "cd2-" + uid, d2)
    + ci("キズミー", "ckz-" + uid, kizumi)
    + '</div></div>';
}

function ci(label, id, val) {
  return '<div class="count-item">'
    + '<label style="font-size:12px;margin-bottom:3px">' + label + '</label>'
    + '<input type="number" class="count-input" id="' + id + '" value="' + val + '" min="0" inputmode="numeric"'
    + ' onfocus="if(this.value===\'0\')this.value=\'\'"'
    + ' onblur="if(this.value===\'\')this.value=\'0\'">'
    + '</div>';
}

window.addAreaBlock = function(containerId, prefix) {
  const container = document.getElementById(containerId);
  const idx = container.querySelectorAll(".area-block").length;
  const uid = prefix + "-" + (++blockSeq);
  container.insertAdjacentHTML("beforeend", makeBlockHtml(uid, idx, "", 0,0,0,0,0, idx>0));
};

window.removeBlock = function(uid) {
  const block = document.getElementById("block-"+uid);
  if (!block) return;
  const container = block.parentElement;
  block.remove();
  container.querySelectorAll(".area-block-label").forEach((el,i) => el.textContent = "点検区 " + (i+1));
};

function collectBlocks(containerId) {
  return Array.from(document.querySelectorAll("#" + containerId + " .area-block")).map(b => {
    const uid = b.id.replace("block-","");
    return {
      areaName: (document.getElementById("aname-" + uid)?.value||"").trim(),
      kinsetsu: parseInt(document.getElementById("ck-" + uid)?.value)||0,
      enpo:     parseInt(document.getElementById("ce-" + uid)?.value)||0,
      detail1:  parseInt(document.getElementById("cd1-" + uid)?.value)||0,
      detail2:  parseInt(document.getElementById("cd2-" + uid)?.value)||0,
      kizumi:   parseInt(document.getElementById("ckz-" + uid)?.value)||0,
    };
  });
}

// ---- 明日の点検区（複数） ----
let tomorrowSeq = 0;

window.addTomorrowRow = function(containerId, prefix, value) {
  value = value || "";
  const container = document.getElementById(containerId);
  const uid = "tm-" + prefix + "-" + (++tomorrowSeq);
  const isFirst = container.querySelectorAll(".tomorrow-input-row").length === 0;
  const rmBtn = isFirst ? "" : '<button class="btn-remove-tomorrow" onclick="removeTomorrowRow(\'' + uid + '\')">×</button>';
  container.insertAdjacentHTML("beforeend",
    '<div class="tomorrow-input-row" id="' + uid + '">'
    + '<input type="text" placeholder="例：都島区（稼働なしの場合は「無し」）" value="' + esc(value) + '">'
    + rmBtn
    + '</div>');
};

window.removeTomorrowRow = function(uid) {
  document.getElementById(uid)?.remove();
};

function collectTomorrowRows(containerId) {
  return Array.from(document.querySelectorAll("#" + containerId + " .tomorrow-input-row input"))
    .map(el => el.value.trim())
    .filter(v => v !== "");
}

function resetTomorrowRows(containerId, prefix) {
  document.getElementById(containerId).innerHTML = "";
  addTomorrowRow(containerId, prefix);
}

function fillTomorrowRows(containerId, prefix, values) {
  document.getElementById(containerId).innerHTML = "";
  const arr = Array.isArray(values) ? values : (values ? [values] : []);
  if (arr.length === 0) { addTomorrowRow(containerId, prefix); return; }
  arr.forEach(v => addTomorrowRow(containerId, prefix, v));
}

// 旧データ（tomorrow: string）と新データ（tomorrows: array）両対応
function normTomorrows(r) {
  if (r.tomorrows && Array.isArray(r.tomorrows)) return r.tomorrows;
  if (r.tomorrow) return [r.tomorrow];
  return [];
}
function normTomorrowsKizumi(r) {
  if (r.tomorrowsKizumi && Array.isArray(r.tomorrowsKizumi)) return r.tomorrowsKizumi;
  return [];
}

// 初期化
(function() {
  const uid = "inp-" + (++blockSeq);
  document.getElementById("area-blocks").insertAdjacentHTML(
    "beforeend", makeBlockHtml(uid, 0, "", 0,0,0,0,0, false));
  addTomorrowRow("inp-tomorrow-list", "inp");
  addTomorrowRow("inp-tomorrow-kizumi-list", "inp-kz");
})();

// ---- 送信 ----
window.submitRecord = async function() {
  const date = document.getElementById("inp-date").value;
  const name = document.getElementById("inp-name").value.trim();
  if (!date||!name) { showToast("日付と点検者名は必須です"); return; }
  const areas = collectBlocks("area-blocks");
  if (!areas.length || areas.some(a=>!a.areaName)) { showToast("点検区名を入力してください"); return; }
  const tomorrows = collectTomorrowRows("inp-tomorrow-list");
  const tomorrowsKizumi = collectTomorrowRows("inp-tomorrow-kizumi-list");
  if (!tomorrows.length && !tomorrowsKizumi.length) { showToast("明日の点検区（通常点検またはキズミー）を入力してください"); return; }
  if (!db) { showToast("Firebase未設定のため保存できません"); return; }
  const btn = document.getElementById("submit-btn");
  btn.disabled=true; btn.textContent="送信中...";
  try {
    const companyId = currentUser?.companyId || "unknown";
    await push(ref(db,"records/"+companyId), {
      date, name, areas,
      note:      document.getElementById("inp-note").value.trim(),
      tomorrows,
      tomorrowsKizumi,
      updatedAt: Date.now()
    });
    showToast("送信しました！");
    const c = document.getElementById("area-blocks");
    c.innerHTML = "";
    const uid = "inp-" + (++blockSeq);
    c.insertAdjacentHTML("beforeend", makeBlockHtml(uid,0,"",0,0,0,0,0,false));
    document.getElementById("inp-note").value = "";
    resetTomorrowRows("inp-tomorrow-list", "inp");
    resetTomorrowRows("inp-tomorrow-kizumi-list", "inp-kz");
    document.getElementById("list-date").value = date;
    switchTab("list");
  } catch(e) { showToast("送信エラー: "+e.message); }
  btn.disabled=false; btn.textContent="送信する";
};

// ---- 一覧 ----
window.loadList = function() {
  const date = document.getElementById("list-date").value;
  if (!date) return;
  const container = document.getElementById("list-container");
  container.innerHTML = '<div class="loading">読み込み中...</div>';
  if (!db) { container.innerHTML='<div class="empty-msg">Firebase未設定</div>'; return; }
  if (currentListener) currentListener();
  if (currentUser?.isAdmin) {
    currentListener = onValue(ref(db,"records"), snap => {
      const items = [];
      snap.forEach(compSnap => {
        compSnap.forEach(c => {
          const v = c.val();
          if (v.date === date) {
            const cInfo = Object.values(COMPANY_MAP).find(m => m.companyId === compSnap.key);
            items.push({key:c.key, companyId:compSnap.key, companyName: cInfo ? cInfo.companyName : compSnap.key, ...v});
          }
        });
      });
      items.sort((a,b)=>a.updatedAt-b.updatedAt);
      renderList(items);
    });
  } else {
    const companyId = currentUser?.companyId || "unknown";
    currentListener = onValue(ref(db,"records/"+companyId), snap => {
      const items = [];
      snap.forEach(c => {
        const v = c.val();
        if (v.date === date) items.push({key:c.key, companyId, companyName: currentUser.companyName, ...v});
      });
      items.sort((a,b)=>a.updatedAt-b.updatedAt);
      renderList(items);
    });
  }
};

function normAreas(r) {
  if (r.areas && Array.isArray(r.areas)) return r.areas;
  return [{areaName:r.area||"", kinsetsu:r.kinsetsu||0, enpo:r.enpo||0, detail1:r.detail1||0, detail2:r.detail2||0, kizumi:r.kizumi||0}];
}

function renderList(items) {
  window._lastRenderItems = items;
  const listDate = document.getElementById("list-date").value;
  checkAttend(listDate);
  // エクスポート済みバッジ表示
  onValue(ref(db, "exported/" + listDate), snap => {
    document.getElementById("export-badge").style.display = snap.val() ? "" : "none";
  }, {onlyOnce:true});
  document.getElementById("export-btn").disabled = items.length === 0;
  const container = document.getElementById("list-container");
  if (!items.length) { container.innerHTML='<div class="empty-msg">この日のデータはありません</div>'; return; }

  const areaMap = {};
  items.forEach(r => normAreas(r).forEach(a => {
    const k = a.areaName || "（区名なし）";
    if (!areaMap[k]) areaMap[k] = {kinsetsu:0, enpo:0, detail1:0, detail2:0, kizumi:0};
    areaMap[k].kinsetsu += a.kinsetsu||0;
    areaMap[k].enpo     += a.enpo||0;
    areaMap[k].detail1  += a.detail1||0;
    areaMap[k].detail2  += a.detail2||0;
    areaMap[k].kizumi   += a.kizumi||0;
  }));

  const totals = {kinsetsu:0, enpo:0, detail1:0, detail2:0, kizumi:0};
  Object.values(areaMap).forEach(v => {
    totals.kinsetsu+=v.kinsetsu; totals.enpo+=v.enpo;
    totals.detail1+=v.detail1;  totals.detail2+=v.detail2;
    totals.kizumi+=v.kizumi;
  });

  const AREA_ORDER = [
    "都島区","福島区","此花区","西区","港区","大正区","天王寺区","浪速区",
    "西淀川区","東淀川区","東成区","生野区","旭区","城東区","阿倍野区","住吉区",
    "東住吉区","西成区","淀川区","鶴見区","住之江区","平野区","北区","中央区"
  ];

  function cell(n) { return '<td class="' + (n===0?'zero':'') + '">' + n + '</td>'; }

  const sortedEntries = [
    ...AREA_ORDER.filter(k => areaMap[k]).map(k => [k, areaMap[k]]),
    ...Object.entries(areaMap).filter(([k]) => !AREA_ORDER.includes(k))
  ];

  const rows = sortedEntries.map(([name, v]) =>
    '<tr><td>' + esc(name) + '</td>'
    + cell(v.kinsetsu) + cell(v.enpo) + cell(v.detail1) + cell(v.detail2) + cell(v.kizumi||0)
    + '<td>' + (v.kinsetsu+v.enpo+v.detail1+v.detail2+(v.kizumi||0)) + '</td></tr>'
  ).join("");

  // 次回点検区：全レコードのtomorrowsを集約
  const NASHI = ["無し","なし","ナシ","無"];
  const tomorrowSet = new Set();
  const tomorrowKizumiSet = new Set();
  items.forEach(r => {
    normTomorrows(r).forEach(t => {
      const trimmed = t.trim();
      if (trimmed && !NASHI.includes(trimmed)) tomorrowSet.add(trimmed);
    });
    normTomorrowsKizumi(r).forEach(t => {
      const trimmed = t.trim();
      if (trimmed && !NASHI.includes(trimmed)) tomorrowKizumiSet.add(trimmed);
    });
  });
  const tomorrowAreas = [
    ...AREA_ORDER.filter(k => tomorrowSet.has(k)),
    ...[...tomorrowSet].filter(k => !AREA_ORDER.includes(k))
  ];
  const tomorrowKizumiAreas = [
    ...AREA_ORDER.filter(k => tomorrowKizumiSet.has(k)),
    ...[...tomorrowKizumiSet].filter(k => !AREA_ORDER.includes(k))
  ];

  const tomorrowHtml = '<div class="area-summary">'
    + '<div class="area-summary-title">次回点検区（通常点検）</div>'
    + '<div class="tomorrow-list">'
    + (tomorrowAreas.length
        ? tomorrowAreas.map(t => '<span class="tomorrow-tag">' + esc(t) + '</span>').join("")
        : '<span style="font-size:13px;color:var(--gray-400)">データなし</span>')
    + '</div></div>'
    + '<div class="area-summary" style="margin-top:8px;">'
    + '<div class="area-summary-title">次回点検区（キズミー）</div>'
    + '<div class="tomorrow-list">'
    + (tomorrowKizumiAreas.length
        ? tomorrowKizumiAreas.map(t => '<span class="tomorrow-tag">' + esc(t) + '</span>').join("")
        : '<span style="font-size:13px;color:var(--gray-400)">データなし</span>')
    + '</div></div>';

  const summaryHtml = '<div class="area-summary">'
    + '<div class="area-summary-title">区別集計</div>'
    + '<table class="summary-table"><thead><tr>'
    + '<th>点検区</th><th>近接</th><th>遠方</th><th>詳細1</th><th>詳細2</th><th>キズミー</th><th>合計</th>'
    + '</tr></thead><tbody>'
    + rows
    + '<tr><td>合計</td>'
    + cell(totals.kinsetsu) + cell(totals.enpo) + cell(totals.detail1) + cell(totals.detail2) + cell(totals.kizumi)
    + '<td>' + (totals.kinsetsu+totals.enpo+totals.detail1+totals.detail2+totals.kizumi) + '</td></tr>'
    + '</tbody></table></div>'
    + tomorrowHtml;

  const recordsHtml = items.map(r => {
    const areas = normAreas(r);
    const tomorrows = normTomorrows(r);
    const aHtml = areas.map((a,i) =>
      (i>0?'<hr class="area-divider">':'')
      + '<div class="area-section">'
      + '<span class="area-tag">' + esc(a.areaName) + '</span>'
      + '<div class="counts-row">'
      + '<div class="count-badge"><span class="cb-label">近接</span><span class="cb-val">' + (a.kinsetsu||0) + '</span></div>'
      + '<div class="count-badge"><span class="cb-label">遠方</span><span class="cb-val">' + (a.enpo||0) + '</span></div>'
      + '<div class="count-badge"><span class="cb-label">詳細1</span><span class="cb-val">' + (a.detail1||0) + '</span></div>'
      + '<div class="count-badge"><span class="cb-label">詳細2</span><span class="cb-val">' + (a.detail2||0) + '</span></div>'
          + '<div class="count-badge"><span class="cb-label">キズミー</span><span class="cb-val">' + (a.kizumi||0) + '</span></div>'
      + '</div></div>'
    ).join("");
    return '<div class="record-item">'
      + '<div class="record-header">'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<div class="record-name">' + esc(r.name) + '</div>'
      + (r.companyName ? '<span style="font-size:11px;background:#EAF5EE;color:#1E7A42;border:1px solid #B8DFC2;border-radius:10px;padding:2px 8px;font-weight:500;">' + esc(r.companyName) + '</span>' : '')
      + '</div>'
      + '<div class="record-actions">'
      + '<button class="btn-edit" onclick="openEdit(\'' + r.key + '\')">編集</button>'
      + '<button class="btn-del" onclick="deleteRecord(\'' + r.key + '\')">削除</button>'
      + '</div></div>'
      + aHtml
      + (r.note ? '<div class="record-note">📝 ' + esc(r.note) + '</div>' : '')
      + (tomorrows.length ? '<div class="record-tomorrow">明日（通常）: ' + tomorrows.map(esc).join("、") + '</div>' : '')
      + (normTomorrowsKizumi(r).length ? '<div class="record-tomorrow">明日（キズミー）: ' + normTomorrowsKizumi(r).map(esc).join("、") + '</div>' : '')
      + '</div>';
  }).join("");

  container.innerHTML = summaryHtml + recordsHtml;
}

// ---- 編集 ----
window.openEdit = async function(key) {
  // エクスポート済みチェック
  const dateVal = document.getElementById("list-date").value;
  const expSnap = await new Promise(res => onValue(ref(db, "exported/" + dateVal), res, {onlyOnce:true}));
  if (expSnap.val() && !confirm("この日付はエクスポート済みです。編集しますか？")) return;
  editingKey = key;
  const cId = currentUser?.isAdmin ? (window._lastRenderItems?.find(x=>x.key===key)?.companyId || currentUser.companyId) : currentUser.companyId;
  onValue(ref(db,"records/"+cId+"/"+key), snap => {
    const r = snap.val(); if (!r) return;
    const container = document.getElementById("edit-area-blocks");
    container.innerHTML = "";
    normAreas(r).forEach((a,i) => {
      const uid = "edit-" + (++blockSeq);
      container.insertAdjacentHTML("beforeend", makeBlockHtml(uid, i, a.areaName, a.kinsetsu||0, a.enpo||0, a.detail1||0, a.detail2||0, a.kizumi||0, i>0));
    });
    fillTomorrowRows("edit-tomorrow-list", "edit", normTomorrows(r));
    fillTomorrowRows("edit-tomorrow-kizumi-list", "edit-kz", normTomorrowsKizumi(r));
    document.getElementById("edit-name").value = r.name||"";
    document.getElementById("edit-note").value = r.note||"";
  }, {onlyOnce:true});
  document.getElementById("edit-modal").classList.add("open");
};

window.closeModal = function() {
  document.getElementById("edit-modal").classList.remove("open");
  editingKey = null;
};

window.saveEdit = async function() {
  if (!editingKey||!db) return;
  const editName = document.getElementById("edit-name").value.trim();
  if (!editName) { showToast("担当者名を入力してください"); return; }
  const areas = collectBlocks("edit-area-blocks");
  if (areas.some(a=>!a.areaName)) { showToast("点検区名を入力してください"); return; }
  const tomorrows = collectTomorrowRows("edit-tomorrow-list");
  const tomorrowsKizumi = collectTomorrowRows("edit-tomorrow-kizumi-list");
  if (!tomorrows.length && !tomorrowsKizumi.length) { showToast("明日の点検区（通常点検またはキズミー）を入力してください"); return; }
  try {
    const cId2 = currentUser?.isAdmin ? (window._lastRenderItems?.find(x=>x.key===editingKey)?.companyId || currentUser.companyId) : currentUser.companyId;
    const snap = await new Promise(res=>onValue(ref(db,"records/"+cId2+"/"+editingKey),res,{onlyOnce:true}));
    await set(ref(db,"records/"+cId2+"/"+editingKey), {
      ...snap.val(), name: editName, areas, tomorrows, tomorrowsKizumi,
      note:      document.getElementById("edit-note").value.trim(),
      updatedAt: Date.now()
    });
    showToast("更新しました");
    closeModal();
  } catch(e) { showToast("更新エラー: "+e.message); }
};

window.deleteRecord = async function(key) {
  const dateVal = document.getElementById("list-date").value;
  const expSnap = await new Promise(res => onValue(ref(db, "exported/" + dateVal), res, {onlyOnce:true}));
  if (expSnap.val()) {
    if (!confirm("この日付はエクスポート済みです。削除しますか？")) return;
  } else {
    if (!confirm("この記録を削除しますか？")) return;
  }
  const cIdD = currentUser?.isAdmin ? (window._lastRenderItems?.find(x=>x.key===key)?.companyId || currentUser.companyId) : currentUser.companyId;
  try { await remove(ref(db,"records/"+cIdD+"/"+key)); showToast("削除しました"); }
  catch(e) { showToast("削除エラー: "+e.message); }
};

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ---- Excelエクスポート ----
async function loadExcelJS() {
  if (window.ExcelJS) return;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

const AREA_ROW_MAP = {
  "都島区":6,"福島区":7,"此花区":8,"西区":9,"港区":10,"大正区":11,
  "天王寺区":12,"浪速区":13,"西淀川区":14,"東淀川区":15,"東成区":16,
  "生野区":17,"旭区":18,"城東区":19,"阿倍野区":20,"住吉区":21,
  "東住吉区":22,"西成区":23,"淀川区":24,"鶴見区":25,"住之江区":26,
  "平野区":27,"北区":28,"中央区":29
};

window.exportExcel = async function() {
  const dateVal = document.getElementById("list-date").value;
  if (!window._lastRenderItems || !window._lastRenderItems.length) {
    showToast("エクスポートするデータがありません"); return;
  }
  const btn = document.getElementById("export-btn");
  btn.disabled = true; btn.textContent = "生成中...";
  try {
    await loadExcelJS();
    const res = await fetch('稼働実績テンプレート.xlsx');
    if (!res.ok) throw new Error('テンプレートファイルが取得できません (HTTP ' + res.status + ')');
    const arrayBuf = await res.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(arrayBuf);
    const srcSheet = wb.getWorksheet('元');
    if (!srcSheet) throw new Error('「元」シートが見つかりません');
    const sheetName = dateVal.replace(/-/g, '');
    const newSheet = wb.addWorksheet(sheetName);
    srcSheet.columns.forEach((col, i) => { if (col.width) newSheet.getColumn(i + 1).width = col.width; });
    srcSheet.eachRow({ includeEmpty: true }, (row, rowNum) => {
      const newRow = newSheet.getRow(rowNum);
      if (row.height) newRow.height = row.height;
      row.eachCell({ includeEmpty: true }, (cell, colNum) => {
        const newCell = newRow.getCell(colNum);
        newCell.style = JSON.parse(JSON.stringify(cell.style));
        if (cell.type !== ExcelJS.ValueType.Merge) newCell.value = cell.value;
      });
      newRow.commit();
    });
    (srcSheet.model.merges || []).forEach(merge => { try { newSheet.mergeCells(merge); } catch(e) {} });

    const areaMap = {};
    window._lastRenderItems.forEach(r => {
      const areas = (r.areas && Array.isArray(r.areas)) ? r.areas
        : [{areaName:r.area||"", kinsetsu:r.kinsetsu||0, enpo:r.enpo||0, detail1:r.detail1||0, detail2:r.detail2||0}];
      areas.forEach(a => {
        const k = (a.areaName||"").trim();
        if (!k) return;
        if (!areaMap[k]) areaMap[k] = {enpo:0, kinsetsu:0, detail1:0, detail2:0, kizumi:0};
        areaMap[k].enpo     += a.enpo||0;
        areaMap[k].kinsetsu += a.kinsetsu||0;
        areaMap[k].detail1  += a.detail1||0;
        areaMap[k].detail2  += a.detail2||0;
        areaMap[k].kizumi   += a.kizumi||0;
      });
    });

    let written = 0;
    Object.entries(areaMap).forEach(([areaName, v]) => {
      const rowIdx = AREA_ROW_MAP[areaName];
      if (!rowIdx) return;
      if (v.enpo)     newSheet.getRow(rowIdx).getCell(8).value = v.enpo;
      if (v.kinsetsu) newSheet.getRow(rowIdx).getCell(9).value = v.kinsetsu;
      if (v.detail1)  newSheet.getRow(rowIdx).getCell(10).value = v.detail1;
      if (v.detail2)  newSheet.getRow(rowIdx).getCell(11).value = v.detail2;
      if (v.kizumi)   newSheet.getRow(rowIdx).getCell(12).value = v.kizumi;
      newSheet.getRow(rowIdx).commit();
      written++;
    });
    if (written === 0) { showToast("一致する区名がありませんでした"); return; }

    // 次回点検区（通常・キズミー別）
    const TANTO_NAME = "南\u3000元樹\u3000080-1484-5774";
    const NASHI = ["無し","なし","ナシ","無"];
    const tomorrowSet = new Set();
    const tomorrowKizumiSet = new Set();
    window._lastRenderItems.forEach(r => {
      normTomorrows(r).forEach(t => {
        const trimmed = t.trim();
        if (trimmed && !NASHI.includes(trimmed)) tomorrowSet.add(trimmed);
      });
      normTomorrowsKizumi(r).forEach(t => {
        const trimmed = t.trim();
        if (trimmed && !NASHI.includes(trimmed)) tomorrowKizumiSet.add(trimmed);
      });
    });
    // 通常点検の次回点検区
    tomorrowSet.forEach(areaName => {
      const rowIdx = AREA_ROW_MAP[areaName];
      if (!rowIdx) return;
      const row = newSheet.getRow(rowIdx);
      row.getCell(13).value = "○";
      row.getCell(14).value = TANTO_NAME;
      row.getCell(15).value = "○";
      row.getCell(16).value = TANTO_NAME;
      row.getCell(17).value = "○";
      row.getCell(18).value = TANTO_NAME;
      row.getCell(19).value = "○";
      row.getCell(20).value = TANTO_NAME;
      row.commit();
    });
    // キズミーの次回点検区（21〜22列目に書き込み）
    tomorrowKizumiSet.forEach(areaName => {
      const rowIdx = AREA_ROW_MAP[areaName];
      if (!rowIdx) return;
      const row = newSheet.getRow(rowIdx);
      row.getCell(21).value = "○";
      row.getCell(22).value = TANTO_NAME;
      row.commit();
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const filename = "稼働実績_" + sheetName + ".xlsx";
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(filename + " をダウンロードしました");
    // エクスポート済みフラグをFirebaseに保存
    try {
      await set(ref(db, "exported/" + dateVal), { at: Date.now(), by: currentUser?.email || "" });
      document.getElementById("export-badge").style.display = "";
    } catch(e) { console.error("エクスポートフラグ保存エラー:", e); }
  } catch(e) {
    console.error(e);
    showToast('エラー: ' + (e.message || '生成に失敗しました'));
  }
  btn.disabled = false; btn.textContent = "Excel様式にエクスポート";
};

// ---- 点検者登録 ----
let attendSeq = 0;

window.addAttendRow = function(value) {
  value = value || "";
  const container = document.getElementById("attend-list");
  const uid = "att-" + (++attendSeq);
  const isFirst = container.querySelectorAll(".tomorrow-input-row").length === 0;
  const rmBtn = isFirst ? "" : '<button class="btn-remove-tomorrow" onclick="removeAttendRow(\'' + uid + '\')">×</button>';
  container.insertAdjacentHTML("beforeend",
    '<div class="tomorrow-input-row" id="' + uid + '">'
    + '<input type="text" placeholder="例：山田" value="' + esc(value) + '">'
    + rmBtn
    + '</div>');
};

window.removeAttendRow = function(uid) {
  document.getElementById(uid)?.remove();
};

function collectAttendRows() {
  return Array.from(document.querySelectorAll("#attend-list .tomorrow-input-row input"))
    .map(el => el.value.trim()).filter(v => v !== "");
}

// 管理者の選択中会社ID
let adminSelectedCompany = null;

window.initAttend = async function() {
  const date = document.getElementById("attend-date").value;
  if (!date || !db) return;
  const companyId = currentUser?.companyId || "unknown";

  if (currentUser?.isAdmin) {
    // 管理者：会社タブを表示
    document.getElementById("attend-company-tabs").style.display = "";
    const tabBtns = document.getElementById("attend-tab-btns");
    const companies = Object.entries(COMPANY_MAP).map(([email, info]) => ({
      companyId: info.companyId, companyName: info.companyName
    }));
    // 重複除去
    const seen = new Set();
    const uniqueCompanies = companies.filter(c => {
      if (seen.has(c.companyId)) return false;
      seen.add(c.companyId);
      return true;
    });
    // 初期選択
    if (!adminSelectedCompany) adminSelectedCompany = uniqueCompanies[0].companyId;

    tabBtns.innerHTML = uniqueCompanies.map(c =>
      '<button onclick="selectAttendCompany(\'' + c.companyId + '\',\'' + c.companyName + '\')" '
      + 'style="padding:6px 14px;border-radius:20px;border:1px solid;font-size:13px;cursor:pointer;transition:all 0.15s;'
      + (adminSelectedCompany === c.companyId
        ? 'background:#247658;color:#fff;border-color:#247658;'
        : 'background:rgba(255,255,255,0.5);color:#247658;border-color:#247658;')
      + '">' + esc(c.companyName) + '</button>'
    ).join("");

    loadAttendForCompany(adminSelectedCompany, date);
  } else {
    // 一般：自社のみ
    document.getElementById("attend-company-tabs").style.display = "none";
    loadAttendForCompany(companyId, date);
  }
};

function loadAttendForCompany(cId, date) {
  onValue(ref(db, "attendance/" + cId + "/" + date), snap => {
    const container = document.getElementById("attend-list");
    container.innerHTML = "";
    attendSeq = 0;
    const val = snap.val();
    const names = Array.isArray(val) ? val : [];
    if (names.length === 0) {
      addAttendRow();
    } else {
      names.forEach(n => addAttendRow(n));
    }
    checkAttend(date);
  }, { onlyOnce: true });
}

window.clearAllAttend = function() {
  if (!confirm("登録中の点検者を全員削除しますか？")) return;
  const container = document.getElementById("attend-list");
  container.innerHTML = "";
  attendSeq = 0;
};

window.selectAttendCompany = function(cId, cName) {
  adminSelectedCompany = cId;
  initAttend(); // タブ再描画＋データ読み込み
};

window.saveAttend = async function() {
  const date = document.getElementById("attend-date").value;
  if (!date) { showToast("日付を選択してください"); return; }
  const names = collectAttendRows();
  if (!db) return;
  const cId = currentUser?.isAdmin ? adminSelectedCompany : (currentUser?.companyId || "unknown");
  try {
    await set(ref(db, "attendance/" + cId + "/" + date), names);
    showToast("保存しました！");
    checkAttend(date);
  } catch(e) { showToast("保存エラー: " + e.message); }
};

function checkAttend(date) {
  if (!db || !date) return;
  const card   = document.getElementById("attend-check-card");
  const result = document.getElementById("attend-check-result");
  const companyId = currentUser?.companyId || "unknown";

  // 点検者取得: 管理者→全社、一般→自社
  const attendRef = currentUser?.isAdmin
    ? ref(db, "attendance")
    : ref(db, "attendance/" + companyId + "/" + date);

  onValue(attendRef, snapA => {
    const val = snapA.val();
    let registered = [];
    if (currentUser?.isAdmin && val) {
      Object.values(val).forEach(companyDates => {
        if (companyDates && companyDates[date]) {
          const arr = companyDates[date];
          if (Array.isArray(arr)) registered = registered.concat(arr);
        }
      });
    } else if (Array.isArray(val)) {
      registered = val;
    }

    // 報告取得: 管理者→全社、一般→自社
    const recordsRef = currentUser?.isAdmin
      ? ref(db, "records")
      : ref(db, "records/" + companyId);

    onValue(recordsRef, snapR => {
      const reported = new Set();
      if (currentUser?.isAdmin) {
        snapR.forEach(compSnap => {
          compSnap.forEach(c => {
            const v = c.val();
            if (v.date === date) reported.add(v.name);
          });
        });
      } else {
        snapR.forEach(c => {
          const v = c.val();
          if (v.date === date) reported.add(v.name);
        });
      }

      const registeredSet = new Set(registered);
      const extraReported = [...reported].filter(n => !registeredSet.has(n));

      if (!registered.length && !extraReported.length) {
        card.style.display = "none";
        return;
      }
      card.style.display = "";

      const tags = [
        ...registered.filter(n => reported.has(n)).map(n =>
          '<span style="font-size:12px;background:rgba(13,158,106,0.12);color:#0d9e6a;border:1px solid rgba(13,158,106,0.25);border-radius:20px;padding:3px 10px;white-space:nowrap;">✅ ' + esc(n) + '</span>'
        ),
        ...registered.filter(n => !reported.has(n)).map(n =>
          '<span style="font-size:12px;background:rgba(226,75,74,0.1);color:#e24b4a;border:1px solid rgba(226,75,74,0.25);border-radius:20px;padding:3px 10px;white-space:nowrap;">✏️ ' + esc(n) + '</span>'
        ),
        ...extraReported.map(n =>
          '<span style="font-size:12px;background:rgba(41,42,45,0.08);color:#292a2d;border:1px solid rgba(41,42,45,0.2);border-radius:20px;padding:3px 10px;white-space:nowrap;">❓ ' + esc(n) + '</span>'
        ),
      ];

      const unreportedCount = registered.filter(n => !reported.has(n)).length;
      const headerHtml = unreportedCount === 0
        ? '<div style="font-size:12px;font-weight:500;color:#0d9e6a;margin-bottom:8px;">✅ 登録済み全員報告済み！</div>'
        : '<div style="font-size:12px;font-weight:500;color:#e24b4a;margin-bottom:8px;">⚠️ 未報告 ' + unreportedCount + '名 / ' + registered.length + '名中</div>';

      result.innerHTML = headerHtml
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + tags.join("") + '</div>';

    }, { onlyOnce: true });
  }, { onlyOnce: true });
}

// ---- エクスポート済み解除 ----
window.cancelExport = async function() {
  if (!confirm("エクスポート済みを解除しますか？")) return;
  const dateVal = document.getElementById("list-date").value;
  try {
    await remove(ref(db, "exported/" + dateVal));
    document.getElementById("export-badge").style.display = "none";
    showToast("エクスポート済みを解除しました");
  } catch(e) {
    showToast("解除エラー: " + e.message);
  }
};

function showToast(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}
